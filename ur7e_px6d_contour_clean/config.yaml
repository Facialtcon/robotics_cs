# Mock + dry-run remains the default. Real motion requires separate Enter confirmations.
robot:
  robot_ip: 192.168.1.10
  max_tcp_speed: 0.030          # m/s; unchanged global limit, return uses 0.027 m/s
  speed_acceleration: 0.050     # m/s^2; MUST CONFIRM on site
  stop_deceleration: 0.200      # m/s^2; MUST CONFIRM on site
  fixed_z: null                 # null = latch actual start Z; verify before execute
  fixed_z_tolerance: 0.001      # m; MUST CONFIRM from measured RTDE noise
  orientation_tolerance_rad: 0.01745  # ~1 degree; MUST CONFIRM

sensor:
  serial_port: /dev/serial/by-id/usb-GigaDevice_GD32-CDC_ACM_1B556A774A92-if00
  baudrate: 921600
  serial_format: 8N1
  crc8_polynomial: 0x07
  poll_rate_hz: 100.0
  timeout_sec: 0.050           # whole host request budget: pacing/write/drain/read/parse; no blocking flush
  startup_delay_sec: 2.0       # PX6D v1.0.1 USB CDC settle time after open

preprocessing:
  filter_alpha: 0.80  # deprecated, accepted for compatibility; no wrench EMA
  kalman:
    enabled: true
    # Independent Base Fx/Fy/Fz random walks, variances in N^2 per sample.
    # Conservative starting values only; tune using stationary PX6D records.
    process_noise: 0.01
    measurement_noise: 0.25
    initial_covariance: 1.0
  baseline:
    capture_on_start: true
    sample_count: 100
    condition: unloaded_stationary_air  # Do not capture this while touching target.
  gravity_wrench_sensor: [0, 0, 0, 0, 0, 0]  # MUST CALIBRATE at fixed orientation
  coordinate_transform:
    # Supply measured installation R_TS: its columns are PX6D +X/+Y/+Z axes
    # expressed in the active TCP frame (not the flange frame). Or supply R_BS
    # together with the actual TCP rotvec (rad) at which R_BS was measured.
    # Neither is inferred from TCP offset/pose or the probe shaft = TCP +Z.
    # Site-confirmed Sensor -> active TCP/tool rotation: F_T = R_TS @ F_S.
    # Sensor +Z and Tool +Z coincide and point downward; use the confirmed
    # matrix below for the 45-degree XY mounting relationship.
    rotation_sensor_to_tool:
      - [0.70710678, -0.70710678, 0.0]
      - [0.70710678,  0.70710678, 0.0]
      - [0.0,         0.0,        1.0]
    reference_tool_orientation: null
    # Unverified identity, NOT a measured calibration. R_BS maps sensor -> Base
    # at the saved fixed scan orientation. R_BS = R_BT @ R_TS only when the
    # sensor -> tool mounting rotation R_TS has independently been measured.
    # Without either input above, output is sensor_uncalibrated (not Base);
    # real continuous execution reports a configuration error BEFORE connecting
    # devices or starting the lifted return/SEARCH. No verification file is required.
    # Never infer R_TS from TCP pose; the optional direction tool only observes.
    rotation_sensor_to_base:
      - [1, 0, 0]
      - [0, 1, 0]
      - [0, 0, 1]
    # Vector from output-frame origin to sensor origin, expressed in output frame.
    sensor_origin_in_base_m: [0, 0, 0]
    # Null = rotate torque at the sensor origin only, no claim of TCP torque.
    # Vector active TCP/tool origin -> sensor origin, expressed in tool (m),
    # enables M_Base_at_TCP = R_BS M_S + (R_BT r_TS) x (R_BS F_S).
    # PROVISIONAL ASSUMPTION: coaxial origins; use the PX6D drawing's 24 mm
    # total height and assume the load reference plane center is the sensor
    # reference origin. This origin definition is NOT confirmed by the maker.
    sensor_origin_in_tool_m: [0.0, 0.0, 0.024]
  # No-target response at the chosen granular insertion depth, in output frame.
  granular_baseline_output: [0, 0, 0, 0, 0, 0]  # MUST MEASURE

policy:
  control_rate_hz: 100.0
  search_direction_xy: [1, 0]  # mock/dry-run only; real execute uses scan_calibration.yaml
  # Derived from run_20260907_105547_627870: free-search Fxy stayed below
  # about 0.45 N, while 1.0 N detects contact about 4 mm earlier than 2.0 N.
  contact_threshold: 1.0              # N
  contact_hold_time: 0.050            # s, MUST CONFIRM
  safety_force_threshold: 12.0        # N vector norm; existing real continuous diagnostic threshold
  safety_torque_threshold: 1.0        # Nm vector norm; real continuous diagnostic (raw hard backstops below)
  absolute_raw_force_threshold: 60.0  # N, independent backstop; MUST CONFIRM
  absolute_raw_torque_threshold: 5.0  # Nm, independent backstop; MUST CONFIRM
  # Formal scan speeds doubled from 0.009/0.003/0.006/0.006 m/s.
  # All remain below robot.max_tcp_speed=0.030 m/s.
  search_speed: 0.018
  probe_speed: 0.006
  tangent_speed: 0.012
  retract_speed: 0.012
  retract_distance: 0.003
  tangent_step: 0.003
  max_probe_distance: 0.010
  # Maximum initial SEARCH travel from P0: 1.50 m (150 cm).
  max_search_distance: 1.500
  position_tolerance: 0.0002
  follow_hand: COUNTERCLOCKWISE
  # Historical diagnostic only; new contact-geometry policy does not use force sign for motion.
  probe_direction_sign: -1
  minimum_boundary_point_spacing: 0.001
  # No-contact triggers local recovery only AFTER returning to the probe anchor.
  boundary_recovery_enabled: true
  # Contact-geometry policy: validate these conservative local sampling distances on site.
  initialization_clearance: 0.009
  initialization_lateral_offset: 0.0015
  initialization_probe_distance: 0.020
  # First repeat the center window, then try each side; all use probe_speed.
  initialization_max_retries: 3  # at most 4 rounds / 12 local probes
  initialization_timeout_sec: 120.0  # includes anchor transfers and returns
  local_fit_window: 3
  local_fit_max_residual: 0.0006
  recovery_sector_extents_deg: [20, 50, 90, 130, 170]
  recovery_angular_resolution_deg: 10
  confirmation_contact_count: 3
  recovery_ray_length: 0.012
  recovery_probe_speed: 0.006  # m/s; doubled with the other scan motion speeds
  # Corner RECOVERY/CONFIRMATION rays keep their nominal speed while unloaded.
  # Once this fraction of contact force is observed, cap the rest of that ray
  # at 2 mm/s. Existing contact, force-rate, and absolute safety limits still apply.
  corner_approach_force_ratio: 0.5
  corner_approach_speed: 0.002  # m/s; cap only, never raises a lower nominal speed
  confirm_step: 0.003
  # Run 20260907_124418 measured 11.536 N/s during an ordinary low-force
  # contact onset (Fxy only 1.083 N). Keep this guard for abnormal impacts,
  # but leave margin above the observed contact ramp.
  force_rate_limit: 30.0
  # Optional completion is for simulation/debug only; real scans still stop with Q.
  loop_closure_enabled: false
  loop_closure_distance: 0.010
  loop_closure_tangent_tolerance_deg: 40.0
  loop_closure_min_boundary_points: 30
  loop_closure_min_path_length: 0.20
  # null disables planned point/time completion: contour following continues until Q.
  max_boundary_points: null
  max_runtime_sec: null

workspace:
  # Site has been checked; software workspace limiting is disabled.
  enabled: false
  # Limits are ignored while enabled is false.
  limits:
    x_min: 0.0
    x_max: 0.0
    y_min: 0.0
    y_max: 0.0
    z_min: 0.0
    z_max: 0.0

tcp:
  # Replace with the active probe-tip TCP [x,y,z,rx,ry,rz] relative to flange.
  offset: [-0.0032432415690885757, -6.266874371089332e-05, 0.25230436187631455, 0.0, 0.0, 0.0]
  offset_tolerance: 0.0001
  allow_unverified_active_tcp: false

logging:
  output_root: data
  show_contour_result_after_scan: true

calibration:
  file: scan_calibration.yaml
  vertical_probe: true           # derive scan attitude with the probe axis along Base -Z; base must be level
  probe_axis_tcp: [0, 0, 1]      # operator confirmed physical probe shaft = TCP +Z; do not alter TCP offset
  min_direction_calibration_distance: 0.02
  max_direction_calibration_z_difference: 0.005

reset:
  # A reset pose is saved separately and bound to the active TCP used at capture time.
  file: reset_pose.yaml

safe_return:
  # +Z clearance used to choose a transit height safe for both stop and target Z.
  return_lift_distance: 0.030
  startup_bias_sample_count: 100
  # Horizontal return keeps 3 mm/s below the global TCP speed limit.
  return_speed: 0.027
  return_vertical_speed: 0.018
  return_acceleration: 0.030
  return_force_limit: 8.0
  return_torque_limit: 0.7
  return_position_tolerance: 0.0005
  return_orientation_tolerance: 0.0087
  return_segment_timeout_sec: 60.0
  auto_return_after_normal_stop: true

dry_run:
  start_pose: [0.40, -0.20, 0.30, 0, 3.141592653589793, 0]
  mock_contact_force: 4.0
  print_interval_sec: 0.25
  probe_direction_sign: 1
  max_boundary_points: 8
  max_runtime_sec: 120.0

execution:
  default_sensor: mock

# Experimental independent entry point: run_continuous_tracking.py.
# ALL values below: MUST CONFIRM ON SITE. No change to discrete-policy limits.
continuous_tracking:
  enabled: true
  continuous_require_watchdog: false  # custom RTDE watchdog is opt-in
  tangential_speed: 0.001          # m/s
  force_reference: 1.5            # N; interaction magnitude, not pure target force
  force_gain: 0.0005              # (m/s)/N
  force_deadband: 0.15            # N
  normal_speed_limit: 0.0005      # m/s
  force_direction_sign: -1        # Base force = environment ON probe; n = -unit(Base XY)
  # v = vt*t + vn*n; high force -> vn<0 -> unloading along -n.
  # n presses toward the target; -n unloads along the reported reaction force.
  # This physical force convention does NOT verify the sensor mounting matrix.
  # Sign applies only to control directions, never raw/filtered force or R_BS.
  # Do NOT auto-flip; check known Base external force vectors with motion off.
  # Viewed from +Base Z: CW t=R90*n, CCW t=-R90*n (target respectively right/left).
  force_direction_filter_alpha: 0.8  # weight of PREVIOUS filtered XY vector
  search_speed: 0.018             # m/s; initial P0 -> P1 only, same as original search
  search_max_distance: 0.10       # m
  search_max_time_sec: 110.0
  contact_lost_threshold: 0.5     # N, below existing stable contact threshold
  contact_lost_hold_sec: 0.15
  reacquire_speed: 0.0005         # m/s
  reacquire_max_angle_deg: 90.0   # recovery path theta, NOT an identified object corner; other budgets still apply
  reacquire_angular_speed_deg_s: 30.0
  reacquire_max_time_sec: 8.0
  reacquire_max_distance: 0.004   # m displacement bound about actual stopped recovery origin
  max_runtime_sec: null            # real continuous runs until operator/hard fault/spatial exhaustion
  visualization_fps: 10
  # Revision: all new physical values MUST CONFIRM ON SITE.
  max_sample_gap_sec: 0.03          # s; diagnostic only in real continuous execution
  max_observation_age_sec: 0.02     # s; real host-age diagnostic, not device sample age
  cycle_timeout_sec: 0.03          # s; real cycle diagnostic, includes I/O and logging
  settle_speed_mps: 0.0001         # m/s; norm of actual XYZ velocity
  startup_speed_mps: 0.001         # real preflight/bias only; braking still uses settle_speed_mps
  startup_angular_speed_rad_s: 0.01
  startup_position_tolerance: 0.001 # m; real P0 check and bias drift
  hard_z_drift_m: 0.005            # real feedback: original 1 mm tolerance only warns
  hard_orientation_drift_rad: 0.08726646259971647 # 5 degrees; commands remain planar
  settle_hold_sec: 0.08            # s; fresh continuous low-speed observations
  confirmation_timeout_sec: 1.0   # s; bounded wait after threshold/stop request
  direction_min_force: 0.5         # N; processed XY direction signal floor
  direction_min_filtered_force: 0.3 # N; reject near-cancelled EMA vectors
  direction_min_coherence: 0.8     # dimensionless mean resultant / mean magnitude
  direction_jump_deg: 45.0         # degrees; pause and reconfirm, never flip sign
  direction_rate_deg_s: 90.0       # degrees/s; estimate slew limit using actual dt
  direction_slow_rate_deg_s: 45.0 # smooth tangent derating starts before slew saturation
  direction_slow_residual_deg: 10.0
  direction_reconfirm_residual_deg: 30.0
  direction_reconfirm_rate_deg_s: 360.0
  direction_reversal_deg: 150.0   # stop ambiguous reversal in real and simulated tracking; never auto-flip
  direction_confirm_hold_sec: 0.15
  direction_confirm_spread_deg: 8.0
  direction_reconfirm_max_attempts: 3 # bounded retries without 2 mm net progress
  direction_min_progress: 0.002
  direction_resume_scale: 0.25
  direction_resume_sec: 2.0
  direction_resume_distance: 0.00025 # projected advance along newly confirmed tangent
  command_acceleration: 0.01      # m/s^2; XY velocity slew, hard stops bypass
  overload_tangent_zero_force: 2.25 # N; cut tangent before hard force limit
  overload_stall_sec: 0.5          # legacy log compatibility; no longer an unloading decision window
  overload_improvement_force: 0.1 # N; minimum decrease in the 0.25 s mean resultant (not pure normal load)
  unload_resume_force: 2.0        # N; 0.25 N hysteresis below 2.25 N pause threshold
  unload_resume_hold_sec: 0.1     # s; require both current and mean force below resume threshold
  unload_force_window_sec: 0.25   # s; mean/trend evidence, no background subtraction
  unload_evaluation_sec: 1.5      # s; allows 0.2 mm at 0.5 mm/s + filter/acceleration settling
  unload_min_displacement_m: 0.0002 # m; existing position tolerance scale, validate against site noise
  unload_max_displacement_m: 0.001 # m; finite 1 mm excursion, no endless retreat
  unload_max_time_sec: 3.0        # s; total episode budget, never reset by intermittent improvement
  unload_resume_ramp_sec: 0.5     # s; smooth recovery, existing acceleration cap also applies
  memory_max_age_sec: 0.5          # s; maximum age of recovery direction at stop
  reacquire_enabled: true         # use the existing local arc after contact loss
  reacquire_radius: 0.002         # m; independent arc reference radius, no target truth
  reacquire_max_path: 0.004        # m; accumulated ACTUAL TCP path during one search
  reacquire_position_gain: 5.0     # 1/s; actual TCP to position reference feedback
  reacquire_reference_freeze_error: 0.0001 # m; freeze reference progression above this
  reacquire_max_tracking_error: 0.0005     # m; real warning, simulation stop
  boundary_margin: 0.0005         # m; reserve for stopping/communication, MUST VALIDATE
  reacquire_min_progress: 0.002   # m; reject repeated loss without spatial progress
  watchdog_frequency_hz: 20.0    # Hz; robot-side timeout 50 ms; SDK 1.6.5 only verified
  # Continuous execute reuses the existing scan P0/P1 and measured sandbox corners.
  workspace_calibration_file: workspace/config/workspace_calibration.yaml
  real_test_xy_limits: null       # optional extra Base XY restriction; null uses saved raw corners
  site_verification: null        # optional additional record; supplied records must match both calibrations
