<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>实验回放 · __RUN_TITLE__</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#223047;font:14px system-ui,"Microsoft YaHei",sans-serif}
main{max-width:1720px;margin:12px auto;padding:0 12px}header,.controls,.panel,.summary{background:white;border:1px solid #dce3eb;border-radius:10px;padding:12px}
header{margin-bottom:10px}h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0}.muted,.hint{color:#64748b;font-size:12px;line-height:1.6}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
button,select{background:white;border:1px solid #c7d3e1;border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit}button.primary{color:white;background:#2563b1;border-color:#2563b1}button:disabled{opacity:.45;cursor:default}
input[type=range]{accent-color:#2563b1}#rate{width:155px}#rate-value{min-width:44px;font-variant-numeric:tabular-nums}#time{flex:1;min-width:200px}#clock{min-width:145px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:10px}.column{display:flex;flex-direction:column;gap:10px;min-width:0}.panel{min-width:0;position:relative}.heading,.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.heading{justify-content:space-between;margin-bottom:7px}.tools{margin:5px 0}.tools button{font-size:12px;padding:4px 8px}.legend{display:flex;gap:7px 14px;flex-wrap:wrap;align-items:center;font-size:12px;margin:8px 0;min-height:20px}.legend label{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;cursor:pointer}.legend input{margin:0}.swatch{display:inline-block;width:16px;height:0;border-top:3px solid var(--c);vertical-align:middle;margin-right:4px}.swatch.dashed{border-top-style:dashed}.swatch.band{height:10px;background:#64748b26;border:1px dashed #64748b}
#force,#velocity{height:265px}
canvas{display:block;width:100%;height:235px;touch-action:none;cursor:crosshair}.trajectory canvas{height:340px}.direction-body{display:grid;grid-template-columns:minmax(180px,.8fr) minmax(220px,1.2fr);gap:12px;align-items:center}.direction-body canvas{height:235px}.readout{font:12px/1.65 ui-monospace,monospace;white-space:pre-wrap;margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.arrow-controls label{display:flex;align-items:center;gap:6px;font-size:12px}.arrow-controls input[type=range]{width:95px}.summary{margin-top:10px}.summary pre{font:13px/1.65 ui-monospace,monospace;white-space:pre-wrap;margin:8px 0}.event-strip{display:flex;gap:6px;flex-wrap:wrap;max-height:65px;overflow:auto;margin-top:6px}.event-strip button{font-size:11px;padding:3px 6px;border-left:3px solid var(--c)}
.panel.expanded{position:fixed;inset:12px;z-index:50;overflow:auto;box-shadow:0 0 0 100vmax #172a46a6}.panel.expanded canvas{height:calc(100vh - 220px);min-height:260px}.panel.expanded .direction-body{grid-template-columns:2fr 1fr}.panel.expanded .direction-body canvas{height:calc(100vh - 220px)}
.panel.expanded #force,.panel.expanded #velocity{height:calc(100vh - 280px)}
.tooltip{position:fixed;z-index:70;pointer-events:none;background:#172a46;color:white;padding:9px 11px;border-radius:7px;font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap;max-width:340px}.error{padding:20px;color:#b91c1c;background:#fff1f2;white-space:pre-wrap}
@media(max-width:950px){.grid{grid-template-columns:1fr}.direction-body{grid-template-columns:1fr 1fr}.panel.expanded{inset:5px}}@media(max-width:520px){.direction-body{grid-template-columns:1fr}#rate{width:110px}.legend{gap:7px 10px}}
</style>
<main>
<header><h1>接触实验 · 离线回放</h1><div id="name" class="muted"></div><div class="muted">Base 坐标系 · 位置 mm · 力 N · 速度 mm/s · 四个视图独立缩放，时间光标同步</div></header>
<div class="controls"><button id="play" class="primary">播放</button><button id="restart">回到起点</button>
<label for="rate">倍速</label><input id="rate" type="range" min="0.05" max="2" step="0.01" value="0.25" aria-label="播放速度"><output id="rate-value">0.25x</output>
<input id="time" type="range" min="0" step="0.0001" value="0" aria-label="实验时间"><output id="clock"></output>
<button id="contact">首次接触放大</button><button id="lost">丢边放大</button><button id="full">完整实验时间</button></div>
<div class="grid"><div class="column">
<section class="panel trajectory" id="panel-xy"><div class="heading"><h2>TCP 实际轨迹 · Base XY 等比例</h2><div class="tools"><button id="xy-expand">放大显示</button><button id="xy-reset">恢复视图</button></div></div>
<div class="tools"><button id="xy-full">完整轨迹</button><button id="xy-contact">接触区域</button><span class="hint">滚轮缩放 · 拖动平移</span></div>
<div class="legend"><span><i class="swatch" style="--c:#3975ae"></i>搜索／接触</span><span><i class="swatch" style="--c:#16836b"></i>跟踪</span><span><i class="swatch" style="--c:#e68621"></i>丢边恢复</span><span><i class="swatch" style="--c:#9b287b"></i>力</span><span><i class="swatch" style="--c:#2563b1"></i>实际速度</span></div>
<canvas id="xy" aria-label="TCP 实际 XY 轨迹"></canvas><div id="xy-view" class="hint"></div><div id="xy-events" class="event-strip" aria-label="轨迹关键事件"></div></section>
<section class="panel" id="panel-direction"><div class="heading"><h2>TCP 受力与实际速度方向</h2><div class="tools"><button id="direction-expand">放大显示</button><button id="direction-reset">恢复视图</button></div></div>
<div class="tools arrow-controls"><select id="arrows" aria-label="方向箭头显示"><option value="both">力与实际速度</option><option value="force">仅力</option><option value="velocity">仅实际速度</option></select>
<label>力比例<input id="force-scale" type="range" min="0.2" max="20" step="0.05" value="1"></label><label>速度比例<input id="velocity-scale" type="range" min="0.2" max="20" step="0.05" value="1"></label><button id="direction-fit">适合当前箭头</button></div>
<div class="direction-body"><canvas id="direction" aria-label="力和实际速度方向"></canvas><pre id="values" class="readout"></pre></div><div id="scales" class="hint"></div><div class="hint">紫色：力 · 蓝色虚线：实际速度 · 两者独立缩放；滚轮调整视野，拖动平移</div></section>
</div><div class="column">
<section class="panel" id="panel-force"><div class="heading"><h2>力信号 · N</h2><div class="tools"><button id="force-expand">放大显示</button><button id="force-reset">恢复视图</button></div></div>
<div id="force-legend" class="legend"></div><div class="tools"><button id="force-full">完整时间</button><button id="force-auto">纵轴自动</button><span class="hint">滚轮：时间缩放 · Shift+滚轮：纵轴 · 拖动：平移</span></div>
<canvas id="force" aria-label="力曲线"></canvas><div id="thresholds" class="hint"></div><div id="deadband" class="hint"></div><div id="force-view" class="hint"></div></section>
<section class="panel" id="panel-velocity"><div class="heading"><h2>TCP 速度 · mm/s</h2><div class="tools"><button id="velocity-expand">放大显示</button><button id="velocity-reset">恢复视图</button></div></div>
<div class="tools"><select id="component" aria-label="速度分量"><option value="all">vx、vy、XY 合速度</option><option value="0">仅 vx</option><option value="1">仅 vy</option><option value="2">仅 XY 合速度</option></select><button id="velocity-full">完整时间</button><button id="velocity-auto">纵轴自动</button></div>
<div id="velocity-legend" class="legend"></div><canvas id="velocity" aria-label="实际和指令速度曲线"></canvas><div class="hint">实际：实线 · 下发指令：虚线 · 滚轮与拖动只改变本图视野</div><div id="velocity-view" class="hint"></div></section>
</div></div>
<section class="summary"><h2>首次接触附近的记录</h2><pre id="collision"></pre><p id="note" class="muted"></p></section>
<div id="error" hidden class="error"></div><div id="tooltip" class="tooltip" hidden></div>
</main>
<script type="application/json" id="replay-data">__REPLAY_DATA__</script>
<script>__REPLAY_SCRIPT__</script>
</html>
